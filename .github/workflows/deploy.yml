name: Udgiv til GitHub Pages

on:
  push:
    branches: [claude/himmerland-golf-scorecard-7g3jkj]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Én udgivelse ad gangen; nye push afløser en ventende kørsel
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  udgiv:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Slå Pages til (hvis det ikke allerede er slået til)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Pak siden
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Udgiv
        id: deployment
        uses: actions/deploy-pages@v4
