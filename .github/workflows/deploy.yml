name: Udgiv til GitHub Pages

on:
  push:
    branches: [claude/himmerland-golf-scorecard-7g3jkj]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Én udgivelse ad gangen; nye push afløser en ventende kørsel
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  udgiv:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Slå Pages til (hvis det ikke allerede er slået til)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # CNAME-filen alene rækker ikke, når der udgives via Actions:
      # domænet skal registreres i selve Pages-opsætningen.
      - name: Registrér domænet
        env:
          GH_TOKEN: ${{ github.token }}
          DOMAIN: golf.vejleaa.dk
        run: |
          nu=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.cname // ""' 2>/dev/null || echo "")
          if [ "$nu" = "$DOMAIN" ]; then
            echo "Domænet er allerede sat til $DOMAIN"
          elif gh api -X PUT "repos/$GITHUB_REPOSITORY/pages" -f "cname=$DOMAIN"; then
            echo "Domænet sat til $DOMAIN"
          else
            echo "::warning::Kunne ikke sætte domænet automatisk. Sæt det under Settings → Pages → Custom domain."
          fi

      - name: Pak siden
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Udgiv
        id: deployment
        uses: actions/deploy-pages@v4
