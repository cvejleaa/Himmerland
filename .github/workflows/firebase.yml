name: Udgiv Firestore-regler og functions

# Kører når regler, firebase.json eller functions ændres på den gren, siden udgives fra.
# Kræver hemmeligheden FIREBASE_SERVICE_ACCOUNT i repoet (Settings → Secrets and variables →
# Actions): indholdet af en tjenestekonto-nøgle (JSON) fra Firebase Console → Project settings →
# Service accounts → Generate new private key. Uden hemmeligheden springes udrulningen over.
on:
  push:
    branches: [claude/himmerland-golf-scorecard-7g3jkj]
    paths:
      - firestore.rules
      - firebase.json
      - functions/**
      - .github/workflows/firebase.yml
  workflow_dispatch:

concurrency:
  group: firebase
  cancel-in-progress: false

jobs:
  udgiv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Er nøglen på plads?
        id: key
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT mangler – regler og functions udgives ikke. Se README, afsnittet om automatisk udrulning." >> "$GITHUB_STEP_SUMMARY"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v5
        if: steps.key.outputs.ok == 'true'
        with:
          node-version: 22

      - name: Installér Firebase CLI og functions
        if: steps.key.outputs.ok == 'true'
        run: |
          npm install -g firebase-tools
          cd functions && npm install --no-audit --no-fund

      - name: Udgiv Firestore-regler
        if: steps.key.outputs.ok == 'true'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: |
          firebase deploy --only firestore:rules --project himmerland --non-interactive --force
          echo "✅ Firestore-reglerne er udgivet til databasen golf." >> "$GITHUB_STEP_SUMMARY"

      # Functions kræver desuden rollen "Service Account User" på tjenestekontoen (iam.serviceAccounts.actAs
      # på himmerland@appspot.gserviceaccount.com). Mangler den, fejler kun dette trin, og kørslen fortsætter.
      - name: Udgiv Cloud Functions (forsøg)
        if: steps.key.outputs.ok == 'true'
        id: functions
        continue-on-error: true
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: firebase deploy --only functions --project himmerland --non-interactive --force

      - name: Opsummering for functions
        if: steps.key.outputs.ok == 'true'
        run: |
          if [ "${{ steps.functions.outcome }}" = "success" ]; then
            echo "✅ Cloud Functions er udgivet." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "⚠️ Cloud Functions blev ikke udgivet. Giv tjenestekontoen rollen *Service Account User* (Google Cloud Console → IAM → tjenestekontoen fra nøglen → Edit → Add role), så går det igennem næste gang. Den udgave, der allerede kører, er ikke berørt." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Ryd op
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
